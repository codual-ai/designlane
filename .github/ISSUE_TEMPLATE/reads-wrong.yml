name: Designlane reads my app wrong
description: A screen, part, token or component it reads wrong, or can't read.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. The most helpful thing is a short piece of code that shows the problem.
        Please leave out anything private.
        Or skip this form and open a pull request with a case: see "Add a case" in CONTRIBUTING.md.
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options: [SwiftUI, Jetpack Compose, React Native]
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: The code it reads wrong
      description: >-
        A few lines that still show the problem: the view, with only what's needed around the part it reads wrong.
        Leave out anything private.
      placeholder: |
        @Composable
        fun Bar() {
          Row {
            FilledIconToggleButton(checked = true, onCheckedChange = {}) { Icon(icon, null) }
          }
        }
      render: text
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: What Designlane says
      description: The output of `designlane doctor --screen <name>`, or the part of tokens.json or catalog.html that's wrong.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Designlane version
      placeholder: "0.6.0"
