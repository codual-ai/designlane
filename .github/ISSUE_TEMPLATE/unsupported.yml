name: A pattern Designlane doesn't support
description: A way of writing a theme, a token or a view that it doesn't read at all.
labels: ["enhancement"]
body:
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options: [SwiftUI, Jetpack Compose, React Native, Other]
    validations:
      required: true
  - type: textarea
    id: pattern
    attributes:
      label: The pattern
      description: A few lines of code written the way your app writes it.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How common is it?
      description: A library or framework feature that writes it this way, or how many places your app does.
